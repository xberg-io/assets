name: Brand Assets CI
on:
  push:
    branches: [main]
    paths:
      - "banner/**"
      - "logo/**"
      - "favicon/**"
      - "social/**"
      - "docs/**"
      - "scripts/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-brand-assets.yaml"
  pull_request:
    paths:
      - "banner/**"
      - "logo/**"
      - "favicon/**"
      - "social/**"
      - "docs/**"
      - "scripts/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/ci-brand-assets.yaml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ~keep Full history with tags: the check compares HEAD against the floating v1 tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: xberg-io/actions/setup-mise@v1
      - name: Test the brand asset check
        run: mise run test
      - name: Check brand assets
        run: mise run check
