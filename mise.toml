# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
python = "3.13.18"
uv = "0.13.6"

[tasks.test]
description = "Test the brand asset check"
run = "uv run --no-project --with pytest==9.2.0 pytest -q scripts"

[tasks.check]
description = "Check the brand assets against the floating v1 tag"
run = "python3 scripts/check_brand_assets.py"
